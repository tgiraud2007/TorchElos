name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches version name
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "${GITHUB_REF_NAME#v}" != "$VERSION_NAME" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME}"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/torchelos-release.jks
          {
            echo "storeFile=app/torchelos-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          OUTPUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$OUTPUT"
          if ! grep -q "CN=TorchElos" <<< "$OUTPUT"; then
            echo "Unexpected signing certificate"
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "TorchElos-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" "TorchElos-${GITHUB_REF_NAME}.apk" \
            --title "🔦 TorchElos ${GITHUB_REF_NAME}" \
            --generate-notes
